<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><title>Word Quest Quiz</title><style>*{box-sizing:border-box}body{font-family:system-ui,sans-serif;margin:0;background:linear-gradient(135deg,#6a5cff,#25c2a0);min-height:100vh;display:flex;align-items:center;justify-content:center;color:#222}
.card{background:#fff;border-radius:20px;padding:24px;max-width:560px;width:94%;box-shadow:0 10px 30px #0004;text-align:center}
h1{margin:0 0 8px}button{font-size:1.1rem;padding:12px 18px;margin:6px;border:0;border-radius:12px;background:#6a5cff;color:#fff;cursor:pointer}
button:hover{filter:brightness(1.1)}button.ok{background:#1faa59}button.bad{background:#e0453a}button.alt{background:#eee;color:#222}
.big{font-size:2rem;margin:16px 0;min-height:2.4rem}.small{color:#666;font-size:.9rem}input{font-size:1.3rem;padding:10px;border-radius:10px;border:2px solid #ccc;width:80%;text-align:center}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.grid button{height:70px;background:#6a5cff}.grid button.done{background:#1faa59}.grid button.hide{font-size:0}</style></head><body><div class=card><h1>🧠 Word Quest Quiz</h1><div id=lv></div><div class=small id=sc></div><div class=big id=q style='font-size:1.4rem'></div><div id=o></div><div id=msg class=small></div></div><script>function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)}catch(e){}}let LEV=0;function mkLevels(n,f){const e=document.getElementById('lv');e.innerHTML='';['Level 1','Level 2','Level 3'].forEach((t,k)=>{const b=document.createElement('button');b.textContent=t;b.className=k===LEV?'':'alt';b.onclick=()=>{LEV=k;mkLevels(n,f);f()};e.appendChild(b)})}function part(D){const n=Math.ceil(D.length/3);return D.slice(LEV*n,(LEV+1)*n)}const D=[["Opposite of 'hot'", ["cold", "big", "fast"], 0, "بارد"], ["A person who teaches", ["doctor", "teacher", "driver"], 1, "مدرس"], ["We write with a ___", ["pen", "plate", "chair"], 0, "قلم"], ["We drink ___", ["bread", "water", "rice"], 1, "ماء"], ["Opposite of 'big'", ["small", "tall", "long"], 0, "صغير"], ["A place with many books", ["library", "kitchen", "garage"], 0, "مكتبة"], ["Color of the sun", ["yellow", "blue", "black"], 0, "أصفر"], ["We sleep in a ___", ["bed", "car", "shoe"], 0, "سرير"], ["Opposite of 'up'", ["down", "left", "fast"], 0, "تحت"], ["A baby cat is a ___", ["kitten", "puppy", "calf"], 0, "قطة صغيرة"], ["Plural of 'child'", ["childs", "children", "childes"], 1, "أطفال"], ["Past of 'go'", ["goed", "went", "gone"], 1, "راح"], ["Opposite of 'early'", ["late", "soon", "fast"], 0, "متأخر"], ["Past of 'eat'", ["eated", "ate", "eaten"], 1, "أكل"], ["Plural of 'man'", ["mans", "men", "manes"], 1, "رجال"], ["Opposite of 'difficult'", ["easy", "hard", "slow"], 0, "سهل"], ["A person who cooks", ["chef", "pilot", "nurse"], 0, "طباخ"], ["Where do we buy medicine?", ["pharmacy", "bakery", "school"], 0, "صيدلية"], ["Past of 'buy'", ["buyed", "bought", "brought"], 1, "اشترى"], ["Plural of 'foot'", ["foots", "feet", "feets"], 1, "أقدام"], ["Synonym of 'big'", ["huge", "tiny", "thin"], 0, "ضخم"], ["Opposite of 'generous'", ["selfish", "kind", "happy"], 0, "أناني"], ["'Brilliant' means", ["very clever", "very old", "very quiet"], 0, "عبقري"], ["'Rarely' means", ["not often", "always", "every day"], 0, "نادرًا"], ["Past participle of 'write'", ["wrote", "written", "writed"], 1, "كتب"], ["Opposite of 'ancient'", ["modern", "old", "dirty"], 0, "حديث"], ["A doctor works in a ___", ["hospital", "bank", "airport"], 0, "مستشفى"], ["Meaning of 'borrow'", ["take and return", "give away", "throw"], 0, "يستلف"], ["'Exhausted' means", ["very tired", "very happy", "very hungry"], 0, "مرهق"], ["Noun of 'decide'", ["decision", "decided", "decisive"], 0, "قرار"]];let P=[],i=0,s=0;function start(){P=part(D);i=0;s=0;show()}function show(){if(i>=P.length){q.textContent='Finished! Score '+s+'/'+P.length;o.innerHTML='<button onclick="start()">Play again</button>';return}sc.textContent='Question '+(i+1)+'/'+P.length+'  Score '+s;const d=P[i];q.textContent=d[0];say(d[0].replace('___','blank'));o.innerHTML='';d[1].forEach((c,k)=>{const b=document.createElement('button');b.textContent=c;b.onclick=()=>{if(k===d[2]){s++;msg.textContent='✅ Correct!'}else msg.textContent='❌ Answer: '+d[1][d[2]]+(d[3]?'  |  '+d[3]:'');i++;setTimeout(show,1500)};o.appendChild(b)})}mkLevels(3,start);start();</script></body></html>
