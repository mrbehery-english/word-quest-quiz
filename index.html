<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><title>Word Quest Quiz</title><style>*{box-sizing:border-box}body{font-family:system-ui,sans-serif;margin:0;background:linear-gradient(135deg,#6a5cff,#25c2a0);min-height:100vh;display:flex;align-items:center;justify-content:center;color:#222}
.card{background:#fff;border-radius:20px;padding:24px;max-width:560px;width:94%;box-shadow:0 10px 30px #0004;text-align:center}
h1{margin:0 0 8px}button{font-size:1.1rem;padding:12px 18px;margin:6px;border:0;border-radius:12px;background:#6a5cff;color:#fff;cursor:pointer}
button:hover{filter:brightness(1.1)}button.ok{background:#1faa59}button.bad{background:#e0453a}button.alt{background:#eee;color:#222}
.big{font-size:2rem;margin:16px 0;min-height:2.4rem}.small{color:#666;font-size:.9rem}input{font-size:1.3rem;padding:10px;border-radius:10px;border:2px solid #ccc;width:80%;text-align:center}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.grid button{height:70px;background:#6a5cff}.grid button.done{background:#1faa59}.grid button.hide{font-size:0}</style></head><body><div class=card><h1>🧠 Word Quest Quiz</h1><div class=small id=sc></div><div class=big id=q style='font-size:1.4rem'></div><div id=o></div><div id=msg class=small></div></div><script>function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)}catch(e){}}const D=[["Opposite of 'hot'", ["cold", "big", "fast"], 0, ""], ["A person who teaches", ["doctor", "teacher", "driver"], 1, ""], ["We write with a ___", ["pen", "plate", "chair"], 0, ""], ["Plural of 'child'", ["childs", "children", "childes"], 1, ""], ["Past of 'go'", ["goed", "went", "gone"], 1, ""], ["Opposite of 'early'", ["late", "soon", "fast"], 0, ""], ["We drink ___", ["bread", "water", "rice"], 1, ""], ["A place with many books", ["library", "kitchen", "garage"], 0, ""]];let i=0,s=0;function show(){if(i>=D.length){q.textContent='Finished! Score '+s+'/'+D.length;o.innerHTML='<button onclick="i=0;s=0;show()">Play again</button>';return}sc.textContent='Question '+(i+1)+'/'+D.length+'  Score '+s;const d=D[i];q.textContent=d[0];say(d[0].replace('___','blank'));o.innerHTML='';d[1].forEach((c,k)=>{const b=document.createElement('button');b.textContent=c;b.onclick=()=>{if(k===d[2]){s++;msg.textContent='✅ Correct!'}else msg.textContent='❌ Answer: '+d[1][d[2]]+(d[3]?' ('+d[3]+')':'');i++;setTimeout(show,1100)};o.appendChild(b)})}show();</script></body></html>
